<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CN10 Enterprise Fee Control Center</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--blue:#0758b8;--blue2:#0b66d8;--bg:#f3f7fc;--card:#fff;--line:#dbe7f5;--txt:#0b1b35;--muted:#64748b;--ok:#10a56a;--warn:#d97706;--bad:#dc2626;--soft:#eef6ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt)}.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0758b8,#06478f);color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.logo{width:54px;height:54px;background:#fff;color:#0758b8;border-radius:14px;display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{font-size:13px;margin:4px 0 0;color:#cfe4ff}.nav button{width:100%;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:13px 14px;margin:6px 0;text-align:left;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#fff;color:#0758b8}.status{position:absolute;left:18px;right:18px;bottom:24px;background:rgba(255,255,255,.12);border-radius:16px;padding:16px}.main{padding:28px}.top{background:var(--card);border-radius:22px;padding:26px 30px;box-shadow:0 10px 30px rgba(15,23,42,.06);display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h2{margin:0;color:#06478f}.top p{margin:7px 0 0;color:var(--muted)}.user{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;background:#eaf3ff;color:#06478f}.btn.primary{background:#0758b8;color:#fff}.btn.good{background:#10a56a;color:#fff}.btn.bad{background:#ef4444;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06);margin-bottom:18px}.grid{display:grid;gap:14px}.grid.cols4{grid-template-columns:repeat(4,1fr)}.grid.cols3{grid-template-columns:repeat(3,1fr)}.kpi{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}.kpi small{color:var(--muted);font-weight:700}.kpi b{display:block;font-size:28px;margin-top:8px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,select{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:#fff;min-height:44px}select,input[type=text]{flex:1}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.step{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-weight:900;color:#64748b;background:#fff}.step.active{border-color:#7db6ff;background:#eaf3ff;color:#0758b8}.hide{display:none!important}.msg{margin-top:12px;font-weight:800}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}.table th{background:#edf4fb;text-align:left;padding:12px}.table td{border-bottom:1px solid #edf2f7;padding:10px}.pill{border-radius:999px;padding:6px 10px;font-weight:800;font-size:12px;background:#eaf3ff;color:#0758b8}.pill.ok{background:#dcfce7;color:#15803d}.pill.bad{background:#fee2e2;color:#b91c1c}.pill.warn{background:#fef3c7;color:#b45309}.progress{height:14px;background:#e5edf7;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#0758b8,#10a56a);transition:.2s}.login{max-width:420px;margin:10vh auto}.modal{position:fixed;inset:0;background:rgba(2,6,23,.45);display:flex;align-items:center;justify-content:center;z-index:9}.modalbox{background:#fff;border-radius:22px;max-width:560px;width:92%;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.25)}.toast{position:fixed;right:24px;bottom:24px;background:#0f172a;color:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.25);z-index:10;max-width:420px}.small{font-size:13px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:relative;height:auto}.status{position:static;margin-top:18px}.grid.cols4,.grid.cols3,.steps{grid-template-columns:1fr}.top{display:block}.main{padding:14px}}
  </style>
</head>
<body>
<div id="login" class="login card">
  <h2>CN10 Enterprise</h2>
  <p class="small">Đăng nhập Supabase để vận hành hệ thống đối soát ngày.</p>
  <input id="loginEmail" style="width:100%;margin:8px 0" value="admin@cn10.local" placeholder="Email" />
  <input id="loginPass" style="width:100%;margin:8px 0" type="password" placeholder="Mật khẩu" />
  <button class="btn primary" onclick="login()">Đăng nhập</button>
  <div id="loginMsg" class="msg bad"></div>
</div>
<div id="app" class="layout hide">
  <aside class="side">
    <div class="brand"><div class="logo">CN10</div><div><h1>CN10 Enterprise</h1><p>Fee Control Center 1.1.2</p></div></div>
    <div class="nav">
      <button data-view="dashboard" class="active" onclick="showView('dashboard')">📊 Dashboard</button>
      <button data-view="sessions" onclick="showView('sessions')">📁 Phiên đối soát</button>
      <button data-view="upload" onclick="showView('upload')">📤 Upload & Engine</button>
      <button data-view="errors" onclick="showView('errors')">⚠️ Trung tâm lỗi</button>
      <button data-view="money" onclick="showView('money')">🏦 Tiền chưa xác định</button>
      <button data-view="cases" onclick="showView('cases')">📂 Case Master</button>
      <button data-view="close" onclick="showView('close')">🔒 Chốt ngày</button>
      <button data-view="system" onclick="showView('system')">⚙️ Hệ thống</button>
    </div>
    <div class="status"><b>Trạng thái</b><p id="sideStatus">Supabase OK</p><p class="small">Frontend 1.1.2-operational</p></div>
  </aside>
  <main class="main">
    <div class="top"><div><h2>CN10 Enterprise Fee Control Center</h2><p>Quản lý đối soát ngày, dòng tiền, hóa đơn, task lỗi và vòng đời hồ sơ.</p></div><div class="user"><span id="userInfo">...</span><button class="btn" onclick="loadAll()">↻ Tải lại</button><button class="btn" onclick="logout()">Đăng xuất</button></div></div>
    <section id="view-dashboard" class="view"></section>
    <section id="view-sessions" class="view hide"></section>
    <section id="view-upload" class="view hide"></section>
    <section id="view-errors" class="view hide"></section>
    <section id="view-money" class="view hide"></section>
    <section id="view-cases" class="view hide"></section>
    <section id="view-close" class="view hide"></section>
    <section id="view-system" class="view hide"></section>
  </main>
</div>
<div id="toast" class="toast hide"></div>
<div id="modal" class="modal hide"><div class="modalbox"><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="btn primary" onclick="hideModal()">Đóng</button></div></div>
<script>
const CONFIG={SUPABASE_URL:'https://cxdnbywgghrgzfcglpvw.supabase.co',SUPABASE_KEY:'sb_publishable_xJGPUCoyaEI07DgJT6QwwQ_sl4dOUqX',VERSION:'1.1.2-operational'};
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
let currentUser=null, appUser={vai_tro:'guest'}, diemList=[], sessions=[], selectedFile=null, preview=null, results=[], bankUn=[], invUn=[];
const $=id=>document.getElementById(id);
function toast(m){$('toast').innerHTML=m;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),5200)}
function modal(t,b){$('modalTitle').innerHTML=t;$('modalBody').innerHTML=b;$('modal').classList.remove('hide')}function hideModal(){$('modal').classList.add('hide')}
function fmt(n){return Number(n||0).toLocaleString('vi-VN')}function today(){return new Date().toISOString().slice(0,10)}
function normalizeCode(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function money(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;let s=String(v).replace(/\./g,'').replace(/,/g,'.').replace(/[^0-9.-]/g,'');let n=parseFloat(s);return isNaN(n)?0:n}
function excelDate(v){if(!v)return''; if(typeof v==='number'){try{const d=XLSX.SSF.parse_date_code(v);return `${d.d}/${d.m}/${d.y}`}catch(e){return String(v)}} return String(v)}
async function login(){const email=$('loginEmail').value.trim(), password=$('loginPass').value; const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error){$('loginMsg').innerText=error.message;return} await bootstrap()}
async function logout(){await sb.auth.signOut(); location.reload()}
async function bootstrap(){const {data:{user}}=await sb.auth.getUser(); if(!user){$('login').classList.remove('hide');$('app').classList.add('hide');return} currentUser=user; $('login').classList.add('hide');$('app').classList.remove('hide'); await loadAll()}
async function loadAppUser(){let {data}=await sb.from('users_app').select('*,diem(*)').eq('email',currentUser.email).maybeSingle(); appUser=data||{email:currentUser.email,vai_tro:'guest',ho_ten:currentUser.email}; $('userInfo').innerText=`${currentUser.email} · ${appUser.vai_tro||'guest'}`}
async function loadDiem(){const {data,error}=await sb.from('diem').select('*').eq('active',true).order('thu_tu'); if(error)throw error; diemList=data||[]}
async function loadSessions(){const {data,error}=await sb.from('doisoat_session').select('*,diem(*)').order('created_at',{ascending:false}).limit(30); if(error)throw error; sessions=data||[]}
async function loadAll(){try{await loadAppUser(); await loadDiem(); await loadSessions(); renderAll(); $('sideStatus').innerHTML='Supabase OK'}catch(e){$('sideStatus').innerHTML='<span style="color:#fecaca">'+e.message+'</span>'; toast('Lỗi tải dữ liệu: '+e.message)}}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.add('hide')); $('view-'+v).classList.remove('hide'); document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v)); if(v==='errors')loadErrors(); if(v==='cases')loadCases(); if(v==='money')loadMoney(); if(v==='close')loadClose();}
function renderAll(){renderDashboard(); renderSessions(); renderUpload(); renderSystem()}
function renderDashboard(){const el=$('view-dashboard'); el.innerHTML=`<div class="grid cols4"><div class="kpi"><small>Phiên gần đây</small><b>${sessions.length}</b></div><div class="kpi"><small>Điểm</small><b>${diemList.length}</b></div><div class="kpi"><small>Vai trò</small><b>${appUser.vai_tro||'guest'}</b></div><div class="kpi"><small>Version</small><b style="font-size:20px">${CONFIG.VERSION}</b></div></div><div class="card"><h3>Phiên gần đây</h3>${sessionTable(sessions.slice(0,8))}</div>`}
function diemOptions(){return '<option value="">-- Chọn điểm --</option>'+diemList.map(d=>`<option value="${d.id}">${d.ten_diem}</option>`).join('')}
function sessionOptions(){return '<option value="">-- Chọn phiên --</option>'+sessions.map(s=>`<option value="${s.id}">${s.ma_phien} · ${s.diem?.ten_diem||''}</option>`).join('')}
function renderSessions(){const el=$('view-sessions'); el.innerHTML=`<div class="card"><h3>Tạo phiên đối soát ngày</h3><div class="row"><select id="newDiem">${diemOptions()}</select><input id="newDate" type="date" value="${today()}"><input id="newNote" type="text" placeholder="Ghi chú phiên"><button class="btn primary" onclick="createSession()">+ Tạo phiên</button></div><div id="sessionMsg" class="msg"></div></div><div class="card"><h3>Danh sách phiên</h3>${sessionTable(sessions)}</div>`}
function sessionTable(arr){if(!arr.length)return'<p>Không có dữ liệu</p>';return `<table class="table"><thead><tr><th>Mã phiên</th><th>Ngày</th><th>Điểm</th><th>Trạng thái</th><th>Ghi chú</th></tr></thead><tbody>${arr.map(s=>`<tr><td>${s.ma_phien}</td><td>${s.ngay_doi_soat}</td><td>${s.diem?.ten_diem||''}</td><td><span class="pill">${s.trang_thai||'draft'}</span></td><td>${s.ghi_chu||''}</td></tr>`).join('')}</tbody></table>`}
async function createSession(){try{const diem_id=+$('newDiem').value; if(!diem_id)throw new Error('Chọn điểm trước'); const d=diemList.find(x=>x.id===diem_id); const date=$('newDate').value; const code=`DS-${date.replaceAll('-','')}-${d.ma_diem}-${Math.floor(1000+Math.random()*9000)}`; const {error}=await sb.from('doisoat_session').insert({ma_phien:code,diem_id,ngay_doi_soat:date,ghi_chu:$('newNote').value,created_by:currentUser.email,trang_thai:'draft'}); if(error)throw error; $('sessionMsg').className='msg ok';$('sessionMsg').innerText='Đã tạo phiên: '+code; toast('✅ Đã tạo phiên '+code); await loadAll()}catch(e){$('sessionMsg').className='msg bad';$('sessionMsg').innerText=e.message}}
function renderUpload(){const el=$('view-upload'); el.innerHTML=`<div class="card"><h3>Upload & chạy engine</h3><div class="steps"><div class="step active">1. Chọn phiên</div><div class="step">2. Chọn file</div><div class="step">3. Preview</div><div class="step">4. Engine</div><div class="step">5. Lưu</div></div><br><div class="row"><select id="upSession">${sessionOptions()}</select><input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm"><button class="btn" onclick="previewFile()">🔎 Preview file</button><button class="btn primary" onclick="runEngine()">🚀 Chạy engine</button><button class="btn good" id="saveBtn" onclick="saveAll()">💾 Lưu Supabase</button><button class="btn" onclick="exportCSV()">⬇ Xuất CSV</button></div><div id="saveProgress" class="hide"><p id="saveText" class="small">Đang xử lý...</p><div class="progress"><div id="saveBar" class="bar"></div></div></div><div id="uploadMsg" class="msg"></div></div><div class="card"><h3>Preview / Kết quả</h3><div id="previewBox">Chưa có dữ liệu</div></div>`; $('excelFile').addEventListener('change',e=>{selectedFile=e.target.files[0]})}
function sheetRows(wb,name){const s=wb.Sheets[name];return s?XLSX.utils.sheet_to_json(s,{header:1,defval:''}):[]}
function detectCodeFromText(text, codeSet, lengths){const t=normalizeCode(text); let p=t.indexOf('H26'); while(p>=0){for(const len of lengths){const c=t.substring(p,p+len); if(codeSet.has(c))return c} p=t.indexOf('H26',p+1)} return null}
function parseWorkbook(wb){let feeRows=sheetRows(wb,'dscanbothuphi'), doiRows=sheetRows(wb,'Doisoat'), bankRows=sheetRows(wb,'saoke'), invRows=sheetRows(wb,'sinvoid'); let fees=new Map(); function addFee(code,goc,date,amount,donvi){if(!code)return; let x=fees.get(code)||{ma_hoso_sach:code,ma_hoso_goc:goc,ngay_thu:date,don_vi:donvi,thuphi:0}; x.thuphi+=money(amount); fees.set(code,x)}
  if(feeRows.length){for(let i=1;i<feeRows.length;i++){let r=feeRows[i], g=r[4], c=normalizeCode(g); if(c.includes('H26')) addFee(c,g,excelDate(r[5]),r[9],r[0])}}
  if(!fees.size && doiRows.length){for(let i=1;i<doiRows.length;i++){let r=doiRows[i], found=null,goc=''; for(const cell of r){let c=normalizeCode(cell); if(c.includes('H26')){found=c;goc=String(cell);break}} if(found) addFee(found,goc,excelDate(r[1]||r[2]), r[3]||r[4]||0, r[0])}}
  const codeSet=new Set([...fees.keys()]); const lengths=[...new Set([...fees.keys()].map(x=>x.length))].sort((a,b)=>b-a); let bankMap=new Map(), bankUn=[]; for(let i=18;i<bankRows.length;i++){let r=bankRows[i]||[], desc=[r[11],r[15],r[16]].join(' '), ref=String(r[15]||r[11]||''), amt=money(r[6])-money(r[5]); if(!amt)continue; let code=detectCodeFromText(desc,codeSet,lengths); if(code){bankMap.set(code,(bankMap.get(code)||0)+amt)}else bankUn.push({ngay_giao_dich:excelDate(r[0]||r[1]),tham_chieu:ref,dien_giai:desc,so_tien:amt})}
  let invMap=new Map(), invNo=new Map(), invUn=[]; for(let i=8;i<invRows.length;i++){let r=invRows[i]||[], sohd=String(r[3]||''), ngay=excelDate(r[4]), amt=money(r[32]), text=[r[42],r[67],r[72]].join(' '); if(!amt && !text)continue; let code=detectCodeFromText(text,codeSet,lengths); if(code){invMap.set(code,(invMap.get(code)||0)+amt); if(sohd)invNo.set(code,sohd)}else invUn.push({ngay_hoa_don:ngay,so_hoa_don:sohd,tong_tien:amt,aq:r[42]||'',bp:r[67]||'',bu:r[72]||''})}
  let results=[]; for(const f of fees.values()){const b=bankMap.get(f.ma_hoso_sach)||0, inv=invMap.get(f.ma_hoso_sach)||0; let code='A01',label='Đủ điều kiện hạch toán',err='',status='matched',huong='Đủ điều kiện ghi nhận/hạch toán'; if(f.thuphi>0&&b===0){code='A02';label='Chờ BIDV';err='Thiếu BIDV';status='need_review';huong='Theo dõi sao kê BIDV ngày tiếp theo hoặc kiểm tra người nộp'} else if(f.thuphi>0&&b>0&&inv===0){code='A03';label='Chờ hóa đơn';err='Thiếu hóa đơn';status='need_review';huong='Kiểm tra và xuất/bổ sung hóa đơn'} else if(f.thuphi!==b||f.thuphi!==inv){code='A04';label='Sai số tiền';err='Sai tiền';status='need_review';huong='Kiểm tra chênh lệch giữa thu phí, BIDV và SInvoice'} results.push({...f,bidv:b,sinvoice:inv,trang_thai:status,loai_loi:err,accounting_code:code,accounting_label:label,huong_xu_ly:huong,xu_ly_status:code==='A01'?'done':'open',so_hoa_don:invNo.get(f.ma_hoso_sach)||''})}
  return {counts:{doisoat:doiRows.length||feeRows.length,saoke:bankRows.length,sinvoice:invRows.length,fee:fees.size},results,bankUn,invUn}
}
async function previewFile(){try{if(!selectedFile)throw new Error('Chưa chọn file'); const buf=await selectedFile.arrayBuffer(); const wb=XLSX.read(buf,{type:'array'}); preview=parseWorkbook(wb); results=preview.results; bankUn=preview.bankUn; invUn=preview.invUn; renderPreview(); $('uploadMsg').className='msg ok';$('uploadMsg').innerText=`Preview xong: ${fmt(results.length)} hồ sơ, ${fmt(results.filter(x=>x.accounting_code!=='A01').length)} cần xử lý`}catch(e){$('uploadMsg').className='msg bad';$('uploadMsg').innerText=e.message}}
function renderPreview(){const p=preview;if(!p)return; $('previewBox').innerHTML=`<div class="grid cols4"><div class="kpi"><small>File</small><p>${selectedFile.name}</p></div><div class="kpi"><small>Hồ sơ</small><b>${fmt(p.results.length)}</b></div><div class="kpi"><small>Sao kê chưa nhận diện</small><b>${fmt(p.bankUn.length)}</b></div><div class="kpi"><small>Hóa đơn chưa nhận diện</small><b>${fmt(p.invUn.length)}</b></div></div><br><div class="row"><button class="btn primary" onclick="filterResult('all')">Tất cả</button><button class="btn" onclick="filterResult('need')">Cần xử lý</button><button class="btn" onclick="filterResult('A02')">Chờ BIDV</button><button class="btn" onclick="filterResult('A03')">Chờ hóa đơn</button><button class="btn" onclick="filterResult('A04')">Sai tiền</button></div><br><div id="resultTable"></div>`; filterResult('all')}
function filterResult(f){let arr=results; if(f==='need')arr=arr.filter(x=>x.accounting_code!=='A01'); else if(f!=='all')arr=arr.filter(x=>x.accounting_code===f); $('resultTable').innerHTML=`<table class="table"><thead><tr><th>Đơn vị</th><th>Mã hồ sơ</th><th>Ngày</th><th>Thu phí</th><th>BIDV</th><th>SInvoice</th><th>Trạng thái</th><th>Loại lỗi</th></tr></thead><tbody>${arr.slice(0,200).map(r=>`<tr><td>${r.don_vi||''}</td><td>${r.ma_hoso_goc||r.ma_hoso_sach}</td><td>${r.ngay_thu||''}</td><td>${fmt(r.thuphi)}</td><td>${fmt(r.bidv)}</td><td>${fmt(r.sinvoice)}</td><td><span class="pill ${r.accounting_code==='A01'?'ok':'warn'}">${r.accounting_code}</span></td><td>${r.accounting_label}</td></tr>`).join('')}</tbody></table><p class="small">Hiển thị 200 dòng đầu / ${fmt(arr.length)} dòng</p>`}
function runEngine(){if(!preview){toast('Hãy preview file trước');return} toast(`✅ Đã chạy engine: ${fmt(results.length)} hồ sơ, ${fmt(results.filter(x=>x.accounting_code!=='A01').length)} cần xử lý`)}
async function batchInsert(table, rows, size=500, onProgress=()=>{}){for(let i=0;i<rows.length;i+=size){const chunk=rows.slice(i,i+size); const {error}=await sb.from(table).insert(chunk); if(error)throw error; onProgress(Math.min(i+chunk.length,rows.length),rows.length)}}
function setProgress(txt,pct){$('saveProgress').classList.remove('hide');$('saveText').innerText=txt;$('saveBar').style.width=pct+'%'}
async function saveAll(){const sessionId=+$('upSession').value; if(!sessionId){toast('Chọn phiên trước');return} if(!preview){toast('Chưa có dữ liệu preview');return} const s=sessions.find(x=>x.id===sessionId); const btn=$('saveBtn'); btn.disabled=true; btn.innerText='💾 Đang lưu...'; const t0=Date.now(); try{setProgress('Đang lưu metadata file...',5); const sig=selectedFile.name+'-'+selectedFile.size+'-'+sessionId; const {data:fileData,error:fileErr}=await sb.from('doisoat_file').insert({session_id:sessionId,diem_id:s.diem_id,loai_file:'workbook',file_name:selectedFile.name,file_size:selectedFile.size,file_signature:sig,row_count:results.length,uploaded_by:currentUser.email}).select().single(); if(fileErr)throw fileErr; setProgress('Đang lưu kết quả đối soát...',10); const rows=results.map(r=>({session_id:sessionId,diem_id:s.diem_id,ma_hoso_goc:r.ma_hoso_goc,ma_hoso_sach:r.ma_hoso_sach,don_vi:r.don_vi,ngay_thu:r.ngay_thu,thuphi:r.thuphi,bidv:r.bidv,sinvoice:r.sinvoice,trang_thai:r.trang_thai,loai_loi:r.loai_loi,so_hoa_don:r.so_hoa_don,accounting_code:r.accounting_code,accounting_label:r.accounting_label,huong_xu_ly:r.huong_xu_ly,xu_ly_status:r.xu_ly_status})); await batchInsert('doisoat_result',rows,500,(done,total)=>setProgress(`Đang lưu kết quả ${fmt(done)} / ${fmt(total)}`,10+Math.round(done/total*45))); const tasks=rows.filter(r=>r.accounting_code!=='A01').map(r=>({session_id:sessionId,diem_id:s.diem_id,ma_hoso:r.ma_hoso_sach,loai_loi:r.accounting_code,noi_dung:r.accounting_label,huong_xu_ly:r.huong_xu_ly,trang_thai:'open',created_by:currentUser.email})); setProgress('Đang sinh task lỗi...',60); if(tasks.length)await batchInsert('task_xuly',tasks,500,(done,total)=>setProgress(`Đang lưu task ${fmt(done)} / ${fmt(total)}`,60+Math.round(done/total*15))); const bu=bankUn.map(r=>({...r,session_id:sessionId,diem_id:s.diem_id})); const iu=invUn.map(r=>({...r,session_id:sessionId,diem_id:s.diem_id})); setProgress('Đang lưu sao kê/hóa đơn chưa nhận diện...',78); if(bu.length)await batchInsert('bank_unidentified',bu,500); if(iu.length)await batchInsert('invoice_unidentified',iu,500); setProgress('Đang cập nhật phiên...',92); await sb.from('doisoat_session').update({trang_thai:tasks.length?'review':'reconciled'}).eq('id',sessionId); await sb.from('workflow_history').insert({session_id:sessionId,action:'SAVE_RECONCILE',detail:{file:selectedFile.name,results:rows.length,tasks:tasks.length,bank_unidentified:bu.length,invoice_unidentified:iu.length},created_by:currentUser.email}); setProgress('Hoàn tất',100); const sec=Math.round((Date.now()-t0)/1000); modal('✅ Lưu thành công',`<p><b>Phiên:</b> ${s.ma_phien}</p><p><b>Đã lưu:</b> ${fmt(rows.length)} hồ sơ</p><p><b>Cần xử lý:</b> ${fmt(tasks.length)}</p><p><b>Sao kê chưa nhận diện:</b> ${fmt(bu.length)}</p><p><b>Hóa đơn chưa nhận diện:</b> ${fmt(iu.length)}</p><p><b>Thời gian:</b> ${sec} giây</p>`); await loadAll()}catch(e){toast('❌ Lỗi lưu: '+e.message)} finally{btn.disabled=false;btn.innerText='💾 Lưu Supabase'}}
function exportCSV(){if(!results.length){toast('Chưa có dữ liệu');return} const ws=XLSX.utils.json_to_sheet(results); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'ketqua'); XLSX.writeFile(wb,'ketqua_doisoat.xlsx')}
async function loadErrors(){const el=$('view-errors'); el.innerHTML='<div class="card"><h3>Trung tâm lỗi</h3><p>Đang tải...</p></div>'; const {data,error}=await sb.from('v_tonghop_loi').select('*').limit(100); if(error){el.innerHTML='<div class="card"><p class="msg bad">'+error.message+'</p></div>';return} const {data:tasks}=await sb.from('task_xuly').select('*').neq('trang_thai','done').order('id',{ascending:true}).limit(100); el.innerHTML=`<div class="card"><h3>Tổng hợp lỗi</h3>${simpleTable(data||[])}</div><div class="card"><h3>Task cần xử lý</h3>${taskTable(tasks||[])}</div>`}
function taskTable(arr){if(!arr.length)return'<p>Không còn task mở.</p>';return `<table class="table"><thead><tr><th>ID</th><th>Mã HS</th><th>Lỗi</th><th>Hướng xử lý</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${arr.map(t=>`<tr><td>${t.id}</td><td>${t.ma_hoso||''}</td><td>${t.loai_loi}</td><td>${t.huong_xu_ly||''}</td><td>${t.trang_thai}</td><td><button class="btn good" onclick="markDone(${t.id})">Đã xử lý</button></td></tr>`).join('')}</tbody></table>`}
async function markDone(id){const note=prompt('Ghi chú xử lý','Đã kiểm tra và xử lý xong')||''; const {data,error}=await sb.rpc('mark_task_done',{p_task_id:id,p_user:currentUser.email,p_note:note}); if(error)toast(error.message); else{toast('✅ '+data); loadErrors()}}
async function loadMoney(){const {data,error}=await sb.from('bank_unidentified').select('*').order('id',{ascending:false}).limit(200); $('view-money').innerHTML=`<div class="card"><h3>Tiền chưa xác định</h3>${error?'<p class="msg bad">'+error.message+'</p>':simpleTable(data||[])}</div>`}
async function loadCases(){const {data,error}=await sb.from('case_master').select('*').order('updated_at',{ascending:false}).limit(200); $('view-cases').innerHTML=`<div class="card"><h3>Case Master</h3>${error?'<p class="msg bad">'+error.message+'</p>':simpleTable(data||[])}</div>`}
async function loadClose(){const {data,error}=await sb.from('v_kiem_tra_chot_ngay').select('*').order('ngay_doi_soat',{ascending:false}).limit(100); $('view-close').innerHTML=`<div class="card"><h3>Chốt ngày</h3>${error?'<p class="msg bad">'+error.message+'</p>':closeTable(data||[])}</div>`}
function closeTable(arr){if(!arr.length)return'<p>Không có dữ liệu.</p>';return `<table class="table"><thead><tr><th>Phiên</th><th>Ngày</th><th>Điểm</th><th>Tổng</th><th>A04</th><th>A99</th><th>Điều kiện</th><th>Thao tác</th></tr></thead><tbody>${arr.map(r=>`<tr><td>${r.ma_phien}</td><td>${r.ngay_doi_soat}</td><td>${r.ten_diem}</td><td>${fmt(r.tong_ho_so)}</td><td>${fmt(r.sai_tien)}</td><td>${fmt(r.can_kiem_tra)}</td><td><span class="pill ${r.co_the_chot?'ok':'bad'}">${r.co_the_chot?'Có thể chốt':'Chưa chốt'}</span></td><td><button class="btn primary" onclick="closeDay(${r.session_id})">Chốt ngày</button></td></tr>`).join('')}</tbody></table>`}
async function closeDay(id){const {data,error}=await sb.rpc('close_day_session',{p_session_id:id,p_user:currentUser.email}); if(error)toast(error.message); else{toast(data); loadClose(); loadSessions()}}
function simpleTable(arr){if(!arr.length)return'<p>Không có dữ liệu.</p>'; const keys=Object.keys(arr[0]).slice(0,8); return `<table class="table"><thead><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${arr.map(r=>`<tr>${keys.map(k=>`<td>${typeof r[k]==='number'?fmt(r[k]):(r[k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function renderSystem(){$('view-system').innerHTML=`<div class="card"><h3>Hệ thống</h3><p><b>Frontend:</b> ${CONFIG.VERSION}</p><p><b>Supabase:</b> ${CONFIG.SUPABASE_URL}</p><p><b>User:</b> ${currentUser?.email||''}</p><p><b>Vai trò:</b> ${appUser.vai_tro||'guest'}</p></div>`}
sb.auth.getSession().then(({data})=>bootstrap());
</script>
</body>
